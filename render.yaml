services:
  - type: web
    name: panel-relojes
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        value: cambia_esto_por_algo_secreto
      - key: WEB_USER
        value: admin
      - key: WEB_PASSWORD
        value: admin123
